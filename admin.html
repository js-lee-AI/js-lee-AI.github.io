<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Jungseob Lee CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>try{const c=JSON.parse(localStorage.getItem('jl-cv-config')||'{}');if(c.theme)document.documentElement.setAttribute('data-theme',c.theme);}catch(e){}</script>
  <style>
    :root,[data-theme="obsidian"]{--bg:#0b0b10;--bg2:#111118;--bg3:#181822;--card:#14141c;--t1:#e8e5df;--t2:#9a97a8;--t3:#6b6878;--accent:#c8a45c;--accent-h:#ddb96f;--accent-d:rgba(200,164,92,.12);--border:#1f1f2c;--border2:#2a2a38;--danger:#d04040;--success:#40a060}
    [data-theme="ivory"]{--bg:#f7f3eb;--bg2:#efebdf;--bg3:#e6e0d4;--card:#fff;--t1:#2a2318;--t2:#6b6050;--t3:#9a9080;--accent:#8b6914;--accent-h:#a67d1a;--accent-d:rgba(139,105,20,.08);--border:#e0d8cc;--border2:#d0c8bb}
    [data-theme="arctic"]{--bg:#f2f5f9;--bg2:#e8ecf3;--bg3:#dde2ec;--card:#fff;--t1:#1a2332;--t2:#5a6578;--t3:#8a93a5;--accent:#2856a0;--accent-h:#3468b8;--accent-d:rgba(40,86,160,.08);--border:#d4dae6;--border2:#c0c8d8}
    [data-theme="midnight"]{--bg:#0a1020;--bg2:#0f1628;--bg3:#151d32;--card:#111830;--t1:#d8dce8;--t2:#8890a8;--t3:#5a6280;--accent:#7898d0;--accent-h:#90b0e0;--accent-d:rgba(120,152,208,.1);--border:#1c2540;--border2:#263050}
    [data-theme="rosewood"]{--bg:#120c0a;--bg2:#1a1210;--bg3:#221a16;--card:#1c1410;--t1:#e8e0d8;--t2:#a89888;--t3:#786858;--accent:#c88a70;--accent-h:#d8a088;--accent-d:rgba(200,138,112,.1);--border:#2c2018;--border2:#382a20}
    [data-theme="sakura"]{--bg:#0f0a10;--bg2:#161018;--bg3:#1e1620;--card:#14101a;--t1:#e8dfe5;--t2:#a898a8;--t3:#786878;--accent:#d4839e;--accent-h:#e09ab2;--accent-d:rgba(212,131,158,.1);--border:#241c28;--border2:#302638}
    [data-theme="emerald"]{--bg:#060e08;--bg2:#0c160e;--bg3:#121e16;--card:#0e1810;--t1:#dce8df;--t2:#88a890;--t3:#587860;--accent:#3da668;--accent-h:#50c07a;--accent-d:rgba(61,166,104,.1);--border:#1a2c1e;--border2:#243828}
    [data-theme="sunset"]{--bg:#110e0a;--bg2:#1a1410;--bg3:#221a14;--card:#181210;--t1:#e8e0d4;--t2:#a89878;--t3:#786848;--accent:#d4893c;--accent-h:#e0a050;--accent-d:rgba(212,137,60,.1);--border:#2c2018;--border2:#382a20}
    [data-theme="neon"]{--bg:#050508;--bg2:#0a0a10;--bg3:#0f0f18;--card:#08081a;--t1:#e0e8f0;--t2:#8098b8;--t3:#506880;--accent:#00d4ff;--accent-h:#40e0ff;--accent-d:rgba(0,212,255,.08);--border:#141428;--border2:#1c1c38}
    [data-theme="ocean"]{--bg:#060e14;--bg2:#0a1620;--bg3:#101e2a;--card:#0c1822;--t1:#d8e4ec;--t2:#7898b0;--t3:#506878;--accent:#20a8b0;--accent-h:#30c0c8;--accent-d:rgba(32,168,176,.1);--border:#142430;--border2:#1e3040}
    [data-theme="lavender"]{--bg:#f0ecf4;--bg2:#e6e0ee;--bg3:#dcd4e6;--card:#fff;--t1:#2a2035;--t2:#685880;--t3:#9888a8;--accent:#7c52b8;--accent-h:#9468d0;--accent-d:rgba(124,82,184,.08);--border:#d4cade;--border2:#c4b8d0}
    [data-theme="monochrome"]{--bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--card:#111;--t1:#e8e8e8;--t2:#999;--t3:#666;--accent:#fff;--accent-h:#ccc;--accent-d:rgba(255,255,255,.08);--border:#222;--border2:#333}
    [data-theme="copper"]{--bg:#0c0a08;--bg2:#141210;--bg3:#1c1814;--card:#12100c;--t1:#e4dcd4;--t2:#a89880;--t3:#786850;--accent:#c87840;--accent-h:#d89058;--accent-d:rgba(200,120,64,.1);--border:#241c14;--border2:#302418}
    [data-theme="aurora"]{--bg:#060a0e;--bg2:#0a1018;--bg3:#101820;--card:#0c1418;--t1:#d4e8e0;--t2:#78a898;--t3:#507868;--accent:#30c890;--accent-h:#48e0a8;--accent-d:rgba(48,200,144,.08);--border:#142820;--border2:#1e3828}
    [data-theme="sand"]{--bg:#f4f0e8;--bg2:#ece6dc;--bg3:#e2dad0;--card:#faf8f4;--t1:#32281e;--t2:#786850;--t3:#a09078;--accent:#a07840;--accent-h:#b89050;--accent-d:rgba(160,120,64,.08);--border:#dcd0c0;--border2:#ccc0b0}
    [data-theme="wine"]{--bg:#0e0608;--bg2:#160c10;--bg3:#1e1218;--card:#140a0e;--t1:#e8dce0;--t2:#a88898;--t3:#785868;--accent:#b83050;--accent-h:#d04068;--accent-d:rgba(184,48,80,.1);--border:#281820;--border2:#382028}
    [data-theme="ice"]{--bg:#f0f4f8;--bg2:#e4eaf0;--bg3:#d8e0e8;--card:#f8fafc;--t1:#1a2028;--t2:#5a6878;--t3:#8a98a8;--accent:#4888c0;--accent-h:#5898d0;--accent-d:rgba(72,136,192,.08);--border:#ccd4de;--border2:#bcc8d4}

    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--t1);line-height:1.6;font-size:14px;transition:background .4s,color .4s}
    a{color:var(--accent);text-decoration:none}

    /* Layout */
    .admin-wrap{max-width:900px;margin:0 auto;padding:24px}
    .admin-header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:32px}
    .admin-header h1{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--t1)}
    .admin-header h1 span{color:var(--accent)}
    .back-link{font-size:13px;color:var(--t3);border:1px solid var(--border2);padding:6px 14px;border-radius:6px;transition:all .2s}
    .back-link:hover{color:var(--accent);border-color:var(--accent)}

    /* Tabs */
    .tabs{display:flex;gap:4px;margin-bottom:32px;border-bottom:1px solid var(--border);padding-bottom:0}
    .tab{padding:10px 20px;font-size:13px;font-weight:500;color:var(--t3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .2s;font-family:inherit}
    .tab:hover{color:var(--t2)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .tab-panel{display:none}.tab-panel.active{display:block}

    /* Forms */
    label{display:block;font-size:12px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
    input[type="text"],input[type="url"],input[type="number"],input[type="password"],select,textarea{
      width:100%;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--t1);font-size:14px;font-family:inherit;transition:border-color .2s;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    textarea{min-height:80px;resize:vertical}
    .form-row{margin-bottom:16px}
    .form-row-inline{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

    /* Buttons */
    .btn{padding:10px 20px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
    .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-h)}
    .btn-outline{background:none;border:1px solid var(--border2);color:var(--t2)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
    .btn-danger{background:none;border:1px solid var(--danger);color:var(--danger)}.btn-danger:hover{background:var(--danger);color:#fff}
    .btn-sm{padding:6px 12px;font-size:12px}
    .btn-group{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

    /* Theme cards */
    .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
    .theme-card{padding:20px;border:2px solid var(--border);border-radius:10px;cursor:pointer;text-align:center;transition:all .3s;position:relative}
    .theme-card:hover{border-color:var(--border2)}.theme-card.selected{border-color:var(--accent);box-shadow:0 0 20px var(--accent-d)}
    .theme-card .check{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);display:none;align-items:center;justify-content:center;color:#fff;font-size:12px}
    .theme-card.selected .check{display:flex}
    .theme-preview{width:100%;height:60px;border-radius:6px;margin-bottom:10px;display:flex;overflow:hidden}
    .theme-preview span{flex:1}
    .theme-name{font-size:13px;font-weight:600;color:var(--t1)}

    /* Paper list */
    .paper-item{padding:16px 20px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;background:var(--card);transition:all .2s}
    .paper-item:hover{border-color:var(--border2)}
    .paper-item-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .paper-item-title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;color:var(--t1);line-height:1.4;flex:1}
    .paper-item-meta{font-size:12px;color:var(--t3);margin-top:4px}
    .paper-item-actions{display:flex;gap:6px;flex-shrink:0}

    /* Image upload */
    .upload-zone{border:2px dashed var(--border2);border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
    .upload-zone:hover{border-color:var(--accent);background:var(--accent-d)}
    .upload-zone.has-image{border-style:solid}
    .upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
    .upload-zone img{max-width:100%;max-height:200px;border-radius:4px;margin-top:8px}
    .upload-text{font-size:13px;color:var(--t3)}
    .upload-text strong{color:var(--t2)}

    /* Links editor */
    .links-grid{display:grid;grid-template-columns:100px 1fr 40px;gap:8px;align-items:center}
    .links-grid label{margin:0;text-transform:none;font-size:13px}
    .link-remove{background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;padding:4px}

    /* Modal */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9000;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:32px;max-width:600px;width:90%;max-height:90vh;overflow-y:auto;position:relative}
    .modal h2{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;margin-bottom:24px;color:var(--t1)}
    .modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--t3);font-size:20px;cursor:pointer}

    /* Toast */
    .toast{position:fixed;bottom:24px;right:24px;padding:12px 24px;border-radius:8px;background:var(--success);color:#fff;font-size:13px;font-weight:600;z-index:9999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
    .toast.show{opacity:1;transform:translateY(0)}

    /* Password gate */
    .gate{min-height:100vh;display:flex;align-items:center;justify-content:center}
    .gate-box{text-align:center;max-width:360px;width:100%;padding:40px}
    .gate-box h2{font-family:'Cormorant Garamond',serif;font-size:28px;margin-bottom:8px}
    .gate-box p{font-size:13px;color:var(--t3);margin-bottom:24px}
    .gate-box input{margin-bottom:16px}

    /* Responsive */
    @media(max-width:600px){
      .admin-wrap{padding:16px}.form-row-inline,.form-row-3{grid-template-columns:1fr}
      .theme-grid{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>

  <!-- GitHub Auth Gate -->
  <div class="gate" id="gate">
    <div class="gate-box">
      <h2>Admin Panel</h2>
      <p>GitHub 계정 인증이 필요합니다</p>
      <div class="form-row">
        <input type="password" id="gatePw" placeholder="GitHub Personal Access Token" autofocus>
      </div>
      <button class="btn btn-primary" id="gateBtn" style="width:100%">Verify</button>
      <p id="gateError" style="margin-top:12px;font-size:12px;color:var(--danger);display:none"></p>
    </div>
  </div>

  <!-- Admin Panel (hidden until auth) -->
  <div class="admin-wrap" id="adminPanel" style="display:none">
    <div class="admin-header">
      <h1>Admin <span>Panel</span></h1>
      <a href="index.html" class="back-link">View Site</a>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="theme">Theme</button>
      <button class="tab" data-tab="papers">Publications</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>

    <!-- Theme Tab -->
    <div class="tab-panel active" id="tab-theme">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="font-size:16px;color:var(--t2)">Select Theme</h3>
        <button class="btn btn-primary btn-sm" id="saveThemeBtn">Save for all visitors</button>
      </div>
      <div class="theme-grid" id="themeGrid"></div>

      <div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <label style="margin:0">Theme Cycle Order (drag to reorder, uncheck to exclude)</label>
          <button class="btn btn-primary btn-sm" id="saveOrderBtn">Save Order for All</button>
        </div>
        <div id="themeOrderList" style="display:flex;flex-direction:column;gap:4px"></div>
      </div>
    </div>

    <!-- Publications Tab -->
    <div class="tab-panel" id="tab-papers">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h3 style="font-size:16px;color:var(--t2)">Manage Publications</h3>
        <button class="btn btn-primary btn-sm" id="addPaperBtn">+ Add Paper</button>
      </div>
      <div id="paperList"></div>
    </div>

    <!-- Settings Tab -->
    <div class="tab-panel" id="tab-settings">
      <h3 style="font-size:16px;margin-bottom:20px;color:var(--t2)">Settings</h3>

      <div class="form-row">
        <label>GitHub Account</label>
        <p style="font-size:13px;color:var(--t2);margin-bottom:8px" id="settingsUser"></p>
        <button class="btn btn-outline" id="logoutBtn">Logout</button>
      </div>

      <div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--border)">
        <label>Profile Links (saved to localStorage)</label>
        <div class="form-row"><label>Google Scholar</label><input type="url" id="link-scholar" placeholder="https://scholar.google.com/..."></div>
        <div class="form-row"><label>GitHub</label><input type="url" id="link-github" placeholder="https://github.com/..."></div>
        <div class="form-row"><label>Email</label><input type="text" id="link-email" placeholder="you@example.com"></div>
        <div class="form-row"><label>LinkedIn</label><input type="url" id="link-linkedin" placeholder="https://linkedin.com/in/..."></div>
        <button class="btn btn-primary btn-sm" id="saveLinksBtn" style="margin-top:8px">Save Links</button>
      </div>

      <div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--border)">
        <label>Data Management</label>
        <div class="btn-group">
          <button class="btn btn-outline" id="exportBtn">Export Config</button>
          <button class="btn btn-outline" id="importBtn">Import Config</button>
          <button class="btn btn-danger" id="resetBtn">Reset All</button>
        </div>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
    </div>
  </div>

  <!-- Edit Paper Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <h2 id="modalTitle">Edit Publication</h2>

      <div class="form-row">
        <label>Title</label>
        <input type="text" id="ed-title">
      </div>
      <div class="form-row">
        <label>Authors (use **Name** to highlight your name)</label>
        <input type="text" id="ed-authors">
      </div>
      <div class="form-row-inline">
        <div class="form-row">
          <label>Venue Short (e.g. ACL 2025)</label>
          <input type="text" id="ed-venue">
        </div>
        <div class="form-row">
          <label>Venue Type</label>
          <select id="ed-venueType">
            <option value="acl">ACL</option>
            <option value="journal">Journal</option>
            <option value="conf">Conference</option>
            <option value="preprint">Preprint</option>
            <option value="workshop">Workshop</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>Venue Full Name</label>
        <input type="text" id="ed-venueFull">
      </div>
      <div class="form-row-inline">
        <div class="form-row">
          <label>Year</label>
          <input type="number" id="ed-year" min="2000" max="2030">
        </div>
        <div class="form-row">
          <label>Citations</label>
          <input type="number" id="ed-citations" min="0">
        </div>
      </div>

      <div class="form-row" style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border)">
        <label>Framework / Architecture Image</label>
        <div class="upload-zone" id="ed-upload">
          <div class="upload-text"><strong>Click or drag</strong> to upload an image</div>
          <input type="file" accept="image/*" id="ed-imageInput">
        </div>
        <div class="btn-group">
          <button class="btn btn-danger btn-sm" id="ed-removeImg" style="display:none">Remove Image</button>
        </div>
      </div>

      <div class="form-row" style="margin-top:16px">
        <label>Links</label>
        <div id="ed-links"></div>
        <button class="btn btn-outline btn-sm" id="ed-addLink" style="margin-top:8px">+ Add Link</button>
      </div>

      <div class="btn-group" style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border)">
        <button class="btn btn-primary" id="ed-save">Save</button>
        <button class="btn btn-outline" id="ed-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
  (function() {
    'use strict';
    var CONFIG_KEY = 'jl-cv-config';
    var PAPERS_KEY = 'jl-cv-papers';
    var TOKEN_KEY = 'jl-cv-gh-token';
    var ALLOWED_USER = 'js-lee-AI';

    // ═══ Helpers ═══
    function getConfig() { try { return JSON.parse(localStorage.getItem(CONFIG_KEY)||'{}'); } catch(e) { return {}; } }
    function saveConfig(c) { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); }
    function getPapers() { try { var s=localStorage.getItem(PAPERS_KEY); if(s) return JSON.parse(s); } catch(e){} return null; }
    function savePapers(p) { localStorage.setItem(PAPERS_KEY, JSON.stringify(p)); }

    function toast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2000);
    }

    // Default papers (same as index.html)
    var DEFAULT_PAPERS = [
      {id:23,title:"Improving Semantic Proximity in Information Retrieval through Cross-Lingual Alignment",authors:"S. Hong, Y. Jang, **J. Lee**, H. Moon, H. Lim",venue:"ICLR 2026 Poster",venueType:"acl",venueFull:"The Fourteenth International Conference on Learning Representations",year:2026,citations:0},
      {id:1,title:"Cross-lingual Optimization for Language Transfer in Large Language Models",authors:"**J. Lee**, S. Hong, H. Moon, H.S. Lim",venue:"ACL 2025 Oral",venueType:"acl",venueFull:"Proceedings of the 63rd Annual Meeting of the Association for Computational Linguistics (Oral)",year:2025,citations:3},
      {id:2,title:"VAETKI Technical Report",authors:"NCAI Consortium",venue:"Report",venueType:"preprint",venueFull:"",year:2025,citations:0},
      {id:3,title:"An Analysis on Language Transfer of Pre-trained Language Model with Cross-lingual Post-training",authors:"S. Son, C. Park, **J. Lee**, M. Shim, C. Lee, Y. Jang, J. Seo, J. Lim, H. Lim",venue:"ESWA",venueType:"journal",venueFull:"Expert Systems With Applications, 267, 125841",year:2025,citations:1},

    function verifyToken(token, silent) {
      fetch('https://api.github.com/user', {
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.login && data.login.toLowerCase() === ALLOWED_USER.toLowerCase()) {
          localStorage.setItem(TOKEN_KEY, token);
          document.getElementById('gate').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'block';
          var userEl = document.getElementById('settingsUser');
          if (userEl) userEl.textContent = 'Logged in as @' + data.login;
          initAdmin();
        } else {
          if (silent) { localStorage.removeItem(TOKEN_KEY); return; }
          showGateError('Access denied. Only @' + ALLOWED_USER + ' can access this page.');
        }
      }).catch(function() {
        if (silent) { localStorage.removeItem(TOKEN_KEY); return; }
        showGateError('Invalid token or network error.');
      }).finally(function() {
        var btn = document.getElementById('gateBtn');
        if (btn) { btn.textContent = 'Verify with GitHub'; btn.disabled = false; }
      });
    }

    function handleImageUpload(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        // Compress via canvas
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var MAX = 800;
          var w = img.width, h = img.height;
          if (w > MAX) { h = h * MAX / w; w = MAX; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          editImage = canvas.toDataURL('image/jpeg', 0.75);
          renderUploadZone();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Save paper
    document.getElementById('ed-save').addEventListener('click', function() {
      var title = document.getElementById('ed-title').value.trim();
      if (!title) { toast('Title is required'); return; }

      var data = {
        title: title,
        authors: document.getElementById('ed-authors').value.trim(),
        venue: document.getElementById('ed-venue').value.trim(),
        venueType: document.getElementById('ed-venueType').value,
        venueFull: document.getElementById('ed-venueFull').value.trim(),
        year: parseInt(document.getElementById('ed-year').value) || 2025,
        citations: parseInt(document.getElementById('ed-citations').value) || 0
      };

      if (editingId) {
        // Update existing
        var idx = papers.findIndex(function(x) { return x.id === editingId; });
        if (idx >= 0) { data.id = editingId; papers[idx] = data; }
      } else {
        // Add new
        var maxId = papers.reduce(function(m, p) { return Math.max(m, p.id); }, 0);
        data.id = maxId + 1;
        editingId = data.id;
        papers.push(data);
      }

      // Save image - commit to GitHub repo for all visitors
      if (!config.paperImages) config.paperImages = {};
      var token = localStorage.getItem(TOKEN_KEY);
      if (editImage && token) {
        // Upload image to repo as assets/papers/{id}.jpg
        var imgPath = 'assets/papers/' + editingId + '.jpg';
        var base64Data = editImage.split(',')[1]; // remove data:image/...;base64, prefix
        (function(path, b64, pid) {
          // Check if file exists (get SHA for update)
          fetch('https://api.github.com/repos/js-lee-AI/js-lee-AI.github.io/contents/' + path, {
            headers: {'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}
          }).then(function(r){return r.json()}).then(function(existing) {
            var body = {message:'Add framework image for paper '+pid, content:b64};
            if (existing.sha) body.sha = existing.sha; // update existing
            return fetch('https://api.github.com/repos/js-lee-AI/js-lee-AI.github.io/contents/' + path, {
              method:'PUT',
              headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
              body:JSON.stringify(body)
            });
          }).then(function(r){return r.json()}).then(function(res) {
            if (res.content) {
              toast('Image committed to repo!');
              // Store path reference (not base64) in config
              config.paperImages[pid] = 'assets/papers/' + pid + '.jpg?v=' + Date.now();
              saveConfig(config);
            }
          }).catch(function(e){ toast('Image upload error: '+e.message); });
        })(imgPath, base64Data, editingId);
      } else if (editImage) {
        config.paperImages[editingId] = editImage; // fallback to localStorage if no token
      } else {
        delete config.paperImages[editingId];
      }

      // Save links
      if (!config.paperLinks) config.paperLinks = {};
      var linkObj = {};
      editLinks.forEach(function(l) { if (l.url) linkObj[l.type] = l.url; });
      if (Object.keys(linkObj).length > 0) {
        config.paperLinks[editingId] = linkObj;
      } else {
        delete config.paperLinks[editingId];
      }

      savePapers(papers);
      saveConfig(config);
      renderPaperList();
      closeEditModal();
      toast('Saved!');
    });

    // ═══ Settings ═══
    // Save theme for all visitors via GitHub API
    document.getElementById('saveThemeBtn').addEventListener('click', function() {
      var token = localStorage.getItem(TOKEN_KEY);
      var theme = config.theme || 'obsidian';
      if (!token) { toast('Login required'); return; }
      this.textContent = 'Saving...'; this.disabled = true;
      var btn = this;
      // Get current index.html
      fetch('https://api.github.com/repos/js-lee-AI/js-lee-AI.github.io/contents/index.html', {
        headers: {'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}
      }).then(function(r){return r.json()}).then(function(data) {
        // UTF-8 safe decode
        var raw = atob(data.content.replace(/\n/g,''));
        var bytes = new Uint8Array(raw.length);
        for(var i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
        var content = new TextDecoder().decode(bytes);
        // Replace data-theme in the html tag
        var updated = content.replace(/data-theme="[^"]*"/, 'data-theme="'+theme+'"');
        // UTF-8 safe encode
        var utf8bytes = new TextEncoder().encode(updated);
        var binary = '';
        for(var i=0;i<utf8bytes.length;i++) binary+=String.fromCharCode(utf8bytes[i]);
        var encoded = btoa(binary);
        return fetch('https://api.github.com/repos/js-lee-AI/js-lee-AI.github.io/contents/index.html', {
          method:'PUT',
          headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
          body:JSON.stringify({message:'Update default theme to '+theme,content:encoded,sha:data.sha})
        });
      }).then(function(r){return r.json()}).then(function(res) {
        if (res.content) { toast('Theme saved for all visitors!'); }
        else { toast('Error: '+JSON.stringify(res.message||res)); }
      }).catch(function(e){ toast('Error: '+e.message); })
      .finally(function(){ btn.textContent='Save for all visitors'; btn.disabled=false; });
    });

    document.getElementById('saveLinksBtn').addEventListener('click', function() {
      if (!config.profileLinks) config.profileLinks = {};
      config.profileLinks.scholar = document.getElementById('link-scholar').value.trim();
      config.profileLinks.github = document.getElementById('link-github').value.trim();
      config.profileLinks.email = document.getElementById('link-email').value.trim();
      config.profileLinks.linkedin = document.getElementById('link-linkedin').value.trim();
      saveConfig(config);
      toast('Profile links saved!');
    });

    document.getElementById('logoutBtn').addEventListener('click', function() {
      localStorage.removeItem(TOKEN_KEY);
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('gate').style.display = 'flex';
      document.getElementById('gatePw').value = '';
      toast('Logged out');
    });

    document.getElementById('exportBtn').addEventListener('click', function() {
      var data = { config: config, papers: papers };
      var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'cv-config.json';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Config exported');
    });

    document.getElementById('importBtn').addEventListener('click', function() {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        try {
          var data = JSON.parse(ev.target.result);
          if (data.config) { config = data.config; saveConfig(config); }
          if (data.papers) { papers = data.papers; savePapers(papers); }
          if (config.theme) document.documentElement.setAttribute('data-theme', config.theme);
          renderThemes();
          renderPaperList();
          toast('Config imported');
        } catch(err) {
          toast('Invalid JSON file');
        }
      };
      reader.readAsText(file);
      this.value = '';
    });

    document.getElementById('resetBtn').addEventListener('click', function() {
      if (confirm('Reset all data to defaults? This cannot be undone.')) {
        localStorage.removeItem(CONFIG_KEY);
        localStorage.removeItem(PAPERS_KEY);
        config = {};
        papers = DEFAULT_PAPERS.slice();
        document.documentElement.setAttribute('data-theme', 'obsidian');
        renderThemes();
        renderPaperList();
        toast('Reset complete');
      }
    });

    // ═══ Init ═══
    // ═══ Theme Order Management ═══
    var allThemeIds = THEMES.map(function(t){return t.id});
    var themeOrder = config.themeOrder || allThemeIds.slice();

    function renderThemeOrder() {
      var list = document.getElementById('themeOrderList');
      list.textContent = '';
      themeOrder.forEach(function(tid, idx) {
        var th = THEMES.find(function(t){return t.id===tid});
        if (!th) return;
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;cursor:grab';
        row.draggable = true;
        row.dataset.tid = tid;
        // Checkbox
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = true;
        cb.style.cssText = 'accent-color:var(--accent);cursor:pointer';
        cb.addEventListener('change', function() {
          if (!this.checked) {
            themeOrder = themeOrder.filter(function(t){return t!==tid});
            renderThemeOrder();
          }
        });
        // Color swatch
        var swatch = document.createElement('div');
        swatch.style.cssText = 'width:16px;height:16px;border-radius:50%;background:'+th.colors[2]+';flex-shrink:0';
        // Name
        var name = document.createElement('span');
        name.textContent = th.name;
        name.style.cssText = 'flex:1;font-size:13px;color:var(--t1)';
        // Up/Down buttons
        var up = document.createElement('button');
        up.textContent = '\u25B2';
        up.className = 'btn btn-outline btn-sm';
        up.style.cssText = 'padding:2px 8px;font-size:10px';
        up.addEventListener('click', function() {
          if (idx > 0) { var t=themeOrder[idx]; themeOrder[idx]=themeOrder[idx-1]; themeOrder[idx-1]=t; renderThemeOrder(); }
        });
        var dn = document.createElement('button');
        dn.textContent = '\u25BC';
        dn.className = 'btn btn-outline btn-sm';
        dn.style.cssText = 'padding:2px 8px;font-size:10px';
        dn.addEventListener('click', function() {
          if (idx < themeOrder.length-1) { var t=themeOrder[idx]; themeOrder[idx]=themeOrder[idx+1]; themeOrder[idx+1]=t; renderThemeOrder(); }
        });
        row.appendChild(cb);
        row.appendChild(swatch);
        row.appendChild(name);
        row.appendChild(up);
        row.appendChild(dn);
        list.appendChild(row);
        // Drag and drop
        row.addEventListener('dragstart', function(e) { e.dataTransfer.setData('text', tid); row.style.opacity='0.5'; });
        row.addEventListener('dragend', function() { row.style.opacity='1'; });
        row.addEventListener('dragover', function(e) { e.preventDefault(); row.style.borderColor='var(--accent)'; });
        row.addEventListener('dragleave', function() { row.style.borderColor='var(--border)'; });
        row.addEventListener('drop', function(e) {
          e.preventDefault();
          row.style.borderColor='var(--border)';
          var fromId = e.dataTransfer.getData('text');
          var fromIdx = themeOrder.indexOf(fromId);
          if (fromIdx < 0) return;
          themeOrder.splice(fromIdx, 1);
          var toIdx = themeOrder.indexOf(tid);
          themeOrder.splice(toIdx, 0, fromId);
          renderThemeOrder();
        });
      });
      // Show excluded themes
      var excluded = allThemeIds.filter(function(t){return themeOrder.indexOf(t)<0});
      if (excluded.length > 0) {
        var divider = document.createElement('div');
        divider.style.cssText = 'font-size:11px;color:var(--t3);margin-top:8px;padding:4px 0';
        divider.textContent = 'Excluded (click to add back):';
        list.appendChild(divider);
        excluded.forEach(function(tid) {
          var th = THEMES.find(function(t){return t.id===tid});
          if (!th) return;
          var row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 12px;opacity:0.4;cursor:pointer';
          row.addEventListener('click', function() { themeOrder.push(tid); renderThemeOrder(); });
          var swatch = document.createElement('div');
          swatch.style.cssText = 'width:16px;height:16px;border-radius:50%;background:'+th.colors[2];
          var name = document.createElement('span');
          name.textContent = th.name + ' +';
          name.style.cssText = 'font-size:13px;color:var(--t3)';
          row.appendChild(swatch);
          row.appendChild(name);
          list.appendChild(row);
        });
      }
    }

    document.getElementById('saveOrderBtn').addEventListener('click', function() {
      config.themeOrder = themeOrder;
      saveConfig(config);
      // Also save via GitHub API
      var token = localStorage.getItem(TOKEN_KEY);
      if (!token) { toast('Theme order saved locally. Login to save for all visitors.'); return; }
      this.textContent = 'Saving...'; this.disabled = true;
      var btn = this;
      var orderStr = "'" + themeOrder.join("','") + "'";
      fetch('https://api.github.com/repos/js-lee-AI/js-lee-AI.github.io/contents/index.html', {
        headers: {'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}
      }).then(function(r){return r.json()}).then(function(data) {
        var raw = atob(data.content.replace(/\n/g,''));
        var bytes = new Uint8Array(raw.length);
        for(var i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
        var content = new TextDecoder().decode(bytes);
        content = content.replace(/var DEFAULT_THEME_ORDER = \[.*?\];/, "var DEFAULT_THEME_ORDER = [" + orderStr + "];");
        var utf8 = new TextEncoder().encode(content);
        var bin=''; for(var i=0;i<utf8.length;i++) bin+=String.fromCharCode(utf8[i]);
        return fetch('https://api.github.com/repos/js-lee-AI/js-lee-AI.github.io/contents/index.html', {
          method:'PUT',
          headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
          body:JSON.stringify({message:'Update theme order',content:btoa(bin),sha:data.sha})
        });
      }).then(function(r){return r.json()}).then(function(res) {
        if (res.content) toast('Theme order saved for all visitors!');
        else toast('Error: '+(res.message||'unknown'));
      }).catch(function(e){toast('Error: '+e.message)})
      .finally(function(){btn.textContent='Save Order for All';btn.disabled=false});
    });

    function initAdmin() {
      renderThemes();
      renderPaperList();
      loadProfileLinks();
      renderThemeOrder();
    }
  })();
  </script>
</body>
</html>
